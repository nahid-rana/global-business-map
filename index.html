<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Company Office Network Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <!-- Leaflet JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- Leaflet Curve for curved lines -->
    <script src="https://unpkg.com/leaflet-curve@0.1.0/dist/leaflet-curve.umd.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f8f9fa;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 1.5px;
        }

        .header p {
            font-size: 1rem;
            opacity: 0.9;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .map-container-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f8f9fa;
        }

        .map-wrapper {
            width: 100%;
            max-width: 1920px;
            aspect-ratio: 16 / 9;
            background: white;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border-radius: 8px;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .leaflet-container {
            background: linear-gradient(180deg, #e3f2fd 0%, #ffffff 50%, #f5f5f5 100%);
        }

        .legend {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            max-width: 300px;
            border: 1px solid rgba(200, 200, 200, 0.3);
        }

        .legend-title {
            font-weight: 700;
            font-size: 0.9rem;
            color: #1e3c72;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: #333;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-marker {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 3px solid white;
            margin-right: 10px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .legend-marker.primary {
            background: #e63946;
        }

        .legend-marker.secondary {
            background: #ffba00;
        }

        .legend-marker.comingsoon {
            background: #a0a0a0;
        }

        .legend-line {
            width: 25px;
            height: 2px;
            background: linear-gradient(90deg, #ff9500, rgba(255, 149, 0, 0.3));
            margin-right: 10px;
            flex-shrink: 0;
        }

        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            max-width: 350px;
            border: 1px solid rgba(200, 200, 200, 0.3);
        }

        .info-panel h3 {
            color: #1e3c72;
            font-size: 0.9rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .info-panel p {
            font-size: 0.85rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .info-panel p:last-child {
            margin-bottom: 0;
        }

        .info-panel strong {
            color: #1e3c72;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .map-wrapper {
                aspect-ratio: 4 / 3;
            }

            .header h1 {
                font-size: 1.4rem;
            }

            .legend {
                top: 15px;
                right: 15px;
                max-width: 240px;
                padding: 15px;
            }

            .info-panel {
                bottom: 15px;
                left: 15px;
                max-width: 280px;
                padding: 15px;
            }
        }

        @media (max-width: 480px) {
            .map-wrapper {
                aspect-ratio: 1 / 1;
                margin: 10px;
            }

            .header h1 {
                font-size: 1.1rem;
            }

            .legend {
                top: 10px;
                right: 10px;
                max-width: 200px;
                padding: 12px;
            }

            .info-panel {
                bottom: 10px;
                left: 10px;
                max-width: calc(100% - 20px);
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="header">
            <h1>GLOBAL COMPANY OFFICE NETWORK</h1>
            <p>Strategic Business Locations Worldwide</p>
        </div>

        <div class="map-container-wrapper">
            <div class="map-wrapper">
                <div id="map"></div>
                
                <div class="legend">
                    <div class="legend-title">Office Locations</div>
                    <div class="legend-item">
                        <div class="legend-marker primary"></div>
                        <span>Primary Hub</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-marker secondary"></div>
                        <span>Regional Office</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-marker comingsoon"></div>
                        <span>Coming Soon</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-line"></div>
                        <span>Connection Routes</span>
                    </div>
                </div>

                <div class="info-panel">
                    <h3>📍 Network Summary</h3>
                    <p><strong>9 Global Locations</strong></p>
                    <p><strong>2 Primary Hubs:</strong> Morocco & Egypt</p>
                    <p><strong>6 Regional Offices:</strong> Europe & North Africa</p>
                    <p><strong>1 Coming Soon:</strong> USA</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize map
        const map = L.map('map', {
            center: [20, 0],
            zoom: 2.8,
            dragging: true,
            scrollWheelZoom: false,
            zoomControl: false,
            attributionControl: false,
            preferCanvas: true
        });

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            minZoom: 2
        }).addTo(map);

        // Location data
        const locations = {
            primary: [
                {
                    name: 'Casablanca, Morocco',
                    address: '410 Blvd. Zerktouni Res. Hamad,\nAppt. N1/C, Casablanca, Morocco',
                    lat: 33.5731,
                    lng: -7.5898,
                    type: 'PRIMARY HUB'
                },
                {
                    name: 'Cairo, Egypt',
                    address: '66 Hammouda Mahmoud Madinat Nasr,\nCairo, Egypt',
                    lat: 30.0444,
                    lng: 31.2357,
                    type: 'PRIMARY HUB'
                }
            ],
            secondary: [
                {
                    name: 'Rabat, Morocco',
                    address: 'Regional Office,\nRabat, Morocco',
                    lat: 34.0209,
                    lng: -6.8416,
                    type: 'REGIONAL OFFICE'
                },
                {
                    name: 'Marrakech, Morocco',
                    address: 'Regional Office,\nMarrakech, Morocco',
                    lat: 31.6295,
                    lng: -8.0096,
                    type: 'REGIONAL OFFICE'
                },
                {
                    name: 'Alexandria, Egypt',
                    address: 'Regional Office,\nAlexandria, Egypt',
                    lat: 31.2001,
                    lng: 29.9187,
                    type: 'REGIONAL OFFICE'
                },
                {
                    name: 'Rotterdam, Netherlands',
                    address: 'Albert Plesmanweg 57A,\n3088 GB Rotterdam, Netherlands',
                    lat: 51.9225,
                    lng: 4.2747,
                    type: 'REGIONAL OFFICE'
                },
                {
                    name: 'Barcelona, Spain',
                    address: 'C/ Sardenya 49,\n08005 Barcelona, España',
                    lat: 41.3851,
                    lng: 2.1734,
                    type: 'REGIONAL OFFICE'
                },
                {
                    name: 'London, United Kingdom',
                    address: '31 Homerton Rd,\nLondon E9 5QB, UK',
                    lat: 51.5574,
                    lng: -0.0757,
                    type: 'REGIONAL OFFICE'
                },
                {
                    name: 'Leicester, United Kingdom',
                    address: 'Welland Rd,\nOakham LE15 8JE, UK',
                    lat: 52.6369,
                    lng: -1.1405,
                    type: 'REGIONAL OFFICE'
                },
                {
                    name: 'Tallinn, Estonia',
                    address: 'Sakala tn 7-2,\n10141 Tallinn, Estonia',
                    lat: 59.4370,
                    lng: 24.7536,
                    type: 'REGIONAL OFFICE'
                }
            ],
            comingsoon: [
                {
                    name: 'New York City, USA',
                    address: 'Coming Soon\nNew York City, USA',
                    lat: 40.7128,
                    lng: -74.0060,
                    type: 'COMING SOON'
                }
            ]
        };

        // Create custom icon
        function createIcon(type) {
            let bgColor = '#e63946'; // primary
            if (type === 'REGIONAL OFFICE') bgColor = '#ffba00';
            if (type === 'COMING SOON') bgColor = '#a0a0a0';

            return L.divIcon({
                html: `
                    <div style="
                        width: 32px;
                        height: 32px;
                        background: ${bgColor};
                        border: 3px solid white;
                        border-radius: 50%;
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        color: white;
                        font-size: 16px;
                        font-weight: bold;
                        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
                        cursor: pointer;
                    ">
                        ●
                    </div>
                `,
                iconSize: [32, 32],
                className: 'custom-icon'
            });
        }

        // Create popup
        function createPopup(location) {
            return `
                <div style="width: 280px;">
                    <div style="font-weight: 700; color: #1e3c72; margin-bottom: 8px; font-size: 0.95rem;">${location.name}</div>
                    <div style="color: #555; font-size: 0.8rem; line-height: 1.5; margin-bottom: 10px; white-space: pre-line;">${location.address}</div>
                    <span style="
                        display: inline-block;
                        padding: 4px 10px;
                        border-radius: 4px;
                        font-size: 0.7rem;
                        font-weight: 600;
                        text-transform: uppercase;
                        background: ${location.type === 'PRIMARY HUB' ? '#e63946' : location.type === 'COMING SOON' ? '#a0a0a0' : '#ffba00'};
                        color: ${location.type === 'COMING SOON' ? 'white' : location.type === 'PRIMARY HUB' ? 'white' : '#000'};
                    ">
                        ${location.type}
                    </span>
                </div>
            `;
        }

        // Combine all locations
        const allLocations = [...locations.primary, ...locations.secondary, ...locations.comingsoon];
        
        // Add all markers
        allLocations.forEach(location => {
            const marker = L.marker([location.lat, location.lng], {
                icon: createIcon(location.type),
                title: location.name
            }).addTo(map);

            marker.bindPopup(createPopup(location), {
                maxWidth: 300,
                minWidth: 250
            });

            marker.on('mouseover', function() { this.openPopup(); });
            marker.on('mouseout', function() { this.closePopup(); });
        });

        // Draw curved lines connecting ALL locations to each other
        // Connect all primary hubs to all secondary offices
        locations.primary.forEach(primary => {
            locations.secondary.forEach(secondary => {
                L.curve([
                    [primary.lat, primary.lng],
                    [secondary.lat, secondary.lng]
                ], {
                    color: '#ff9500',
                    weight: 2.5,
                    opacity: 0.5,
                    dashArray: '5, 5'
                }).addTo(map);
            });

            // Connect primary hubs to coming soon
            locations.comingsoon.forEach(comingSoon => {
                L.curve([
                    [primary.lat, primary.lng],
                    [comingSoon.lat, comingSoon.lng]
                ], {
                    color: '#ff9500',
                    weight: 2.5,
                    opacity: 0.5,
                    dashArray: '5, 5'
                }).addTo(map);
            });
        });

        // Connect all secondary offices to each other
        for (let i = 0; i < locations.secondary.length; i++) {
            for (let j = i + 1; j < locations.secondary.length; j++) {
                L.curve([
                    [locations.secondary[i].lat, locations.secondary[i].lng],
                    [locations.secondary[j].lat, locations.secondary[j].lng]
                ], {
                    color: '#ff9500',
                    weight: 2,
                    opacity: 0.3,
                    dashArray: '5, 5'
                }).addTo(map);
            }
        }

        // Connect secondary offices to coming soon
        locations.secondary.forEach(secondary => {
            locations.comingsoon.forEach(comingSoon => {
                L.curve([
                    [secondary.lat, secondary.lng],
                    [comingSoon.lat, comingSoon.lng]
                ], {
                    color: '#ff9500',
                    weight: 2.5,
                    opacity: 0.5,
                    dashArray: '5, 5'
                }).addTo(map);
            });
        });

        // Connect primary hubs to each other
        L.curve([
            [33.5731, -7.5898],
            [30.0444, 31.2357]
        ], {
            color: '#ff9500',
            weight: 2.5,
            opacity: 0.5,
            dashArray: '5, 5'
        }).addTo(map);

        // Auto fit map bounds
        const bounds = L.latLngBounds(
            allLocations.map(l => [l.lat, l.lng])
        );
        map.fitBounds(bounds, { padding: [100, 100], maxZoom: 3 });
    </script>
</body>
</html>
