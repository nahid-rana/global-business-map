<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Business Locations Map</title>
    
    <!-- amCharts Resources -->
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/map.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/geodata/worldLow.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }

        .map-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        #chartdiv {
            width: 100%;
            height: 100%;
        }

        .location-details {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(255, 255, 255, 0.98);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            z-index: 10;
            max-width: 380px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .location-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .location-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .location-icon.primary {
            background-color: #e63946;
            box-shadow: 0 0 12px rgba(230, 57, 70, 0.6);
        }

        .location-icon.secondary {
            background-color: #ffba00;
            box-shadow: 0 0 10px rgba(255, 186, 0, 0.5);
        }

        .location-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1a1a1a;
        }

        .location-address {
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .location-type {
            display: inline-block;
            background: #e63946;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .location-type.secondary {
            background: #ffba00;
            color: #000;
        }

        .legend {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.98);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
            z-index: 10;
            max-width: 280px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .legend-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 18px;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 14px;
            font-size: 0.85rem;
            color: #333;
        }

        .legend-item:last-child {
            margin-bottom: 0;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .legend-dot.primary {
            background-color: #e63946;
            box-shadow: 0 0 10px rgba(230, 57, 70, 0.5);
        }

        .legend-dot.secondary {
            background-color: #ffba00;
            box-shadow: 0 0 8px rgba(255, 186, 0, 0.4);
        }

        .legend-line {
            width: 20px;
            height: 2px;
            background: linear-gradient(90deg, #ff9500, rgba(255, 149, 0, 0.3));
            margin-right: 12px;
        }

        /* Tooltip Styling */
        .amcharts-tooltip {
            background: rgba(0, 0, 0, 0.9) !important;
            border-radius: 8px !important;
            padding: 10px 15px !important;
            font-size: 0.9rem !important;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            .location-details {
                max-width: 340px;
                padding: 20px;
            }

            .legend {
                max-width: 250px;
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            .map-container {
                aspect-ratio: 4 / 3;
            }

            .location-details {
                bottom: 20px;
                left: 20px;
                max-width: 300px;
                padding: 18px;
            }

            .legend {
                top: 20px;
                right: 20px;
                max-width: 220px;
                padding: 18px;
            }

            .location-name {
                font-size: 1rem;
            }

            .location-address {
                font-size: 0.8rem;
            }

            .legend-title {
                font-size: 0.9rem;
                margin-bottom: 15px;
            }

            .legend-item {
                font-size: 0.8rem;
                margin-bottom: 12px;
            }
        }

        @media (max-width: 480px) {
            .map-container {
                aspect-ratio: 1 / 1;
            }

            .location-details {
                bottom: 15px;
                left: 15px;
                max-width: 100%;
                width: calc(100% - 30px);
                padding: 15px;
            }

            .legend {
                top: 15px;
                right: 15px;
                max-width: calc(100% - 30px);
                padding: 15px;
            }

            .location-name {
                font-size: 0.95rem;
            }

            .location-address {
                font-size: 0.75rem;
            }

            .legend-item,
            .legend-title {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="map-container">
        <div id="chartdiv"></div>
        
        <div class="legend">
            <div class="legend-title">Global Offices</div>
            <div class="legend-item">
                <div class="legend-dot primary"></div>
                <span>Primary Hub</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot secondary"></div>
                <span>Regional Office</span>
            </div>
            <div class="legend-item">
                <div class="legend-line"></div>
                <span>Routes</span>
            </div>
        </div>

        <div class="location-details">
            <div class="location-header">
                <div class="location-icon primary"></div>
                <div class="location-name" id="locationName">Casablanca, Morocco</div>
            </div>
            <div class="location-address" id="locationAddress">
                410 Blvd. Zerktouni Res. Hamad, Appt. N1/C<br>
                Casablanca, Morocco
            </div>
            <span class="location-type" id="locationType">Primary Hub</span>
        </div>
    </div>

    <script>
        // All locations data
        const allLocations = {
            primary: [
                {
                    id: "casablanca",
                    title: "Casablanca, Morocco",
                    address: "410 Blvd. Zerktouni Res. Hamad, Appt. N1/C, Casablanca, Morocco",
                    type: "Primary Hub",
                    geometry: { type: "Point", coordinates: [-7.5898, 33.5731] }
                },
                {
                    id: "cairo",
                    title: "Cairo, Egypt",
                    address: "66 Hammouda Mahmoud Madinat Nasr, Cairo, Egypt",
                    type: "Primary Hub",
                    geometry: { type: "Point", coordinates: [31.2357, 30.0444] }
                }
            ],
            secondary: [
                {
                    id: "rabat",
                    title: "Rabat, Morocco",
                    address: "Regional Office, Rabat, Morocco",
                    type: "Regional Office",
                    geometry: { type: "Point", coordinates: [-6.8416, 34.0209] }
                },
                {
                    id: "marrakech",
                    title: "Marrakech, Morocco",
                    address: "Regional Office, Marrakech, Morocco",
                    type: "Regional Office",
                    geometry: { type: "Point", coordinates: [-8.0096, 31.6295] }
                },
                {
                    id: "alexandria",
                    title: "Alexandria, Egypt",
                    address: "Regional Office, Alexandria, Egypt",
                    type: "Regional Office",
                    geometry: { type: "Point", coordinates: [29.9187, 31.2001] }
                },
                {
                    id: "rotterdam",
                    title: "Rotterdam, Netherlands",
                    address: "Albert Plesmanweg 57A, 3088 GB Rotterdam, The Netherlands",
                    type: "Regional Office",
                    geometry: { type: "Point", coordinates: [4.2747, 51.9225] }
                },
                {
                    id: "barcelona",
                    title: "Barcelona, Spain",
                    address: "C/ Sardenya 49, 08005 Barcelona, España",
                    type: "Regional Office",
                    geometry: { type: "Point", coordinates: [2.1734, 41.3851] }
                },
                {
                    id: "london",
                    title: "London, United Kingdom",
                    address: "31 Homerton Rd, London E9 5QB, UK",
                    type: "Regional Office",
                    geometry: { type: "Point", coordinates: [-0.0757, 51.5574] }
                },
                {
                    id: "leicester",
                    title: "Leicester, United Kingdom",
                    address: "Welland Rd, Oakham LE15 8JE, UK",
                    type: "Regional Office",
                    geometry: { type: "Point", coordinates: [-1.1405, 52.6369] }
                },
                {
                    id: "tallinn",
                    title: "Tallinn, Estonia",
                    address: "Sakala tn 7-2, 10141 Tallinn, Estonia",
                    type: "Regional Office",
                    geometry: { type: "Point", coordinates: [24.7536, 59.4370] }
                }
            ]
        };

        // Update location details panel
        function updateLocationDetails(location) {
            document.getElementById('locationName').textContent = location.title;
            document.getElementById('locationAddress').textContent = location.address;
            document.getElementById('locationType').textContent = location.type;
            
            const icon = document.querySelector('.location-icon');
            if (location.type === 'Primary Hub') {
                icon.className = 'location-icon primary';
                document.getElementById('locationType').className = 'location-type';
            } else {
                icon.className = 'location-icon secondary';
                document.getElementById('locationType').className = 'location-type secondary';
            }
        }

        // Initialize amCharts
        am5.ready(function() {
            // Create root element
            var root = am5.Root.new("chartdiv");

            // Apply theme
            root.setThemes([
                am5themes_Animated.new(root)
            ]);

            // Create map chart with optimized projection for world view
            var chart = root.container.children.push(am5map.MapChart.new(root, {
                panX: "translateX",
                panY: "translateY",
                wheelX: "none",
                wheelY: "none",
                projection: am5map.geoMercator(),
                maxZoomLevel: 4,
                minZoomLevel: 1
            }));

            // Create polygon series for world map
            var polygonSeries = chart.series.push(am5map.MapPolygonSeries.new(root, {
                geoJSON: am5geodata_worldLow,
                exclude: ["AQ"]
            }));

            polygonSeries.mapPolygons.template.setAll({
                strokeOpacity: 0.4,
                stroke: am5.color(0xd0d0d0),
                fill: am5.color(0xf5f5f5)
            });

            polygonSeries.mapPolygons.template.events.on("pointerover", function(ev) {
                ev.target.setAll({
                    fill: am5.color(0xf0f0f0)
                });
            });

            polygonSeries.mapPolygons.template.events.on("pointerout", function(ev) {
                ev.target.setAll({
                    fill: am5.color(0xf5f5f5)
                });
            });

            // Create graticule (grid lines)
            var graticuleSeries = chart.series.push(am5map.GraticuleSeries.new(root, {}));
            graticuleSeries.mapLines.template.setAll({
                stroke: root.interfaceColors.get("alternativeBackground"),
                strokeOpacity: 0.05
            });

            // Create line series for connections
            var lineSeries = chart.series.push(am5map.MapLineSeries.new(root, {}));
            lineSeries.mapLines.template.setAll({
                stroke: am5.color(0xff9500),
                strokeWidth: 2.5,
                strokeOpacity: 0.5,
                strokeDasharray: [4, 4]
            });

            // Create point series for primary hubs
            var primarySeries = chart.series.push(am5map.MapPointSeries.new(root, {}));
            primarySeries.bullets.push(function() {
                var circle = am5.Circle.new(root, {
                    radius: 10,
                    tooltipText: "{title}",
                    fill: am5.color(0xe63946),
                    stroke: am5.color(0xffffff),
                    strokeWidth: 3,
                    tooltipY: 0,
                    cursor: "pointer"
                });

                // Hover effects
                circle.events.on("pointerover", function() {
                    circle.animate({
                        key: "radius",
                        to: 14,
                        duration: 300
                    });
                });

                circle.events.on("pointerout", function() {
                    circle.animate({
                        key: "radius",
                        to: 10,
                        duration: 300
                    });
                });

                return am5.Bullet.new(root, {
                    sprite: circle
                });
            });

            // Create point series for secondary offices
            var secondarySeries = chart.series.push(am5map.MapPointSeries.new(root, {}));
            secondarySeries.bullets.push(function() {
                var circle = am5.Circle.new(root, {
                    radius: 7,
                    tooltipText: "{title}",
                    fill: am5.color(0xffba00),
                    stroke: am5.color(0xffffff),
                    strokeWidth: 2,
                    tooltipY: 0,
                    cursor: "pointer"
                });

                // Hover effects
                circle.events.on("pointerover", function() {
                    circle.animate({
                        key: "radius",
                        to: 11,
                        duration: 300
                    });
                });

                circle.events.on("pointerout", function() {
                    circle.animate({
                        key: "radius",
                        to: 7,
                        duration: 300
                    });
                });

                return am5.Bullet.new(root, {
                    sprite: circle
                });
            });

            // Set data for primary locations
            primarySeries.data.setAll(allLocations.primary);

            // Set data for secondary locations
            secondarySeries.data.setAll(allLocations.secondary);

            // Add click event to update details panel
            primarySeries.events.on("datavalidated", function() {
                primarySeries.bullets.getIndex(0).events.on("click", function(ev) {
                    updateLocationDetails(ev.target.dataItem.dataContext);
                });
            });

            secondarySeries.events.on("datavalidated", function() {
                secondarySeries.bullets.getIndex(0).events.on("click", function(ev) {
                    updateLocationDetails(ev.target.dataItem.dataContext);
                });
            });

            // Create curved connections from Casablanca and Cairo to all other locations
            var primaryCoords = [
                { lat: 33.5731, lon: -7.5898, name: "Casablanca" }, // Casablanca
                { lat: 30.0444, lon: 31.2357, name: "Cairo" }  // Cairo
            ];

            var allSecondaryCoords = allLocations.secondary.map(loc => ({
                lat: loc.geometry.coordinates[1],
                lon: loc.geometry.coordinates[0],
                name: loc.title
            }));

            // Create curved lines connecting hubs to all offices
            primaryCoords.forEach(primary => {
                allSecondaryCoords.forEach(secondary => {
                    lineSeries.pushDataItem({
                        geometry: {
                            type: "LineString",
                            coordinates: [[primary.lon, primary.lat], [secondary.lon, secondary.lat]]
                        }
                    });
                });
            });

            // Also connect the two primary hubs
            lineSeries.pushDataItem({
                geometry: {
                    type: "LineString",
                    coordinates: [[-7.5898, 33.5731], [31.2357, 30.0444]]
                }
            });

            // Zoom to fit all locations optimally
            polygonSeries.events.on("datavalidated", function() {
                // Set center and zoom to show all continents
                chart.zoomToGeoPoint({ longitude: 5, latitude: 25 }, 2.2);
            });

            // Animate on load
            chart.appear(1000, 100);

            // Handle window resize
            window.addEventListener('resize', function() {
                root.relayout();
            });

            // Update details on hover
            primarySeries.events.on("dataitemcreated", function(ev) {
                ev.dataItem.bullets.getIndex(0).events.on("pointerover", function() {
                    updateLocationDetails(ev.dataItem.dataContext);
                });
            });

            secondarySeries.events.on("dataitemcreated", function(ev) {
                ev.dataItem.bullets.getIndex(0).events.on("pointerover", function() {
                    updateLocationDetails(ev.dataItem.dataContext);
                });
            });
        });
    </script>
</body>
</html>
